<style>
/* ===================================================================
   PHYSIX Legends - Global Styles
   =================================================================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --primary: #2196F3;
  --primary-dark: #1565C0;
  --secondary: #FF6B6B;
  --success: #4CAF50;
  --warning: #FFC107;
  --danger: #F44336;
  --dark: #2c3e50;
  --light: #ecf0f1;
  --text: #2c3e50;
  --text-light: #7f8c8d;
  --border: #bdc3c7;
  --shadow: 0 2px 8px rgba(0,0,0,0.1);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.15);
  --radius: 12px;
  --radius-lg: 16px;
}

html, body {
  width: 100%;
  height: 100%;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: var(--text);
  overflow: hidden;
}

/* ===================================================================
   App Container & Screen Management
   =================================================================== */

.app-container {
  width: 100%;
  height: 100%;
  position: relative;
  background: #f5f7fa;
}

.screen {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  transform: translateX(100%);
  transition: all 0.3s ease;
  pointer-events: none;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.screen.active {
  opacity: 1;
  transform: translateX(0);
  pointer-events: auto;
  z-index: 10;
}

.screen.slide-left {
  transform: translateX(-100%);
}

/* ===================================================================
   Loading Screen
   =================================================================== */

#loadingScreen {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 1;
  transform: translateX(0);
  z-index: 1000;
}

.loading-content {
  text-align: center;
  color: white;
}

.loading-logo {
  font-size: 4rem;
  margin-bottom: 1rem;
  animation: bounce 1.5s ease-in-out infinite;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}

#loadingScreen h1 {
  font-size: 2.5rem;
  margin-bottom: 0.5rem;
  font-weight: 700;
}

#loadingScreen p {
  font-size: 1rem;
  opacity: 0.9;
  margin-bottom: 2rem;
}

.loading-bar {
  width: 200px;
  height: 6px;
  background: rgba(255,255,255,0.3);
  border-radius: 10px;
  overflow: hidden;
  margin: 0 auto;
}

.loading-progress {
  height: 100%;
  background: white;
  border-radius: 10px;
  animation: progress 2s ease-in-out infinite;
}

@keyframes progress {
  0% { width: 0%; }
  50% { width: 100%; }
  100% { width: 0%; }
}

/* ===================================================================
   Authentication Screens
   =================================================================== */

#authScreen {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

.auth-container {
  background: white;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 400px;
  padding: 2rem;
}

.auth-header {
  text-align: center;
  margin-bottom: 2rem;
}

.auth-logo {
  font-size: 3rem;
  margin-bottom: 0.5rem;
}

.auth-header h1 {
  font-size: 1.8rem;
  color: var(--dark);
  font-weight: 700;
}

.auth-tabs {
  display: flex;
  gap: 1rem;
  margin-bottom: 1.5rem;
  border-bottom: 2px solid var(--light);
}

.auth-tab {
  flex: 1;
  padding: 1rem 0;
  background: none;
  border: none;
  color: var(--text-light);
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.3s ease;
}

.auth-tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}

.auth-form {
  display: none;
}

.auth-form.active {
  display: block;
}

/* ===================================================================
   Forms & Inputs
   =================================================================== */

.form-group {
  margin-bottom: 1.2rem;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.form-group label {
  display: block;
  margin-bottom: 0.5rem;
  font-weight: 600;
  color: var(--text);
  font-size: 0.95rem;
}

.form-group input {
  width: 100%;
  padding: 0.75rem 1rem;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  font-size: 1rem;
  transition: all 0.3s ease;
}

.form-group input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
}

.error-message {
  color: var(--danger);
  font-size: 0.9rem;
  margin-top: 1rem;
  padding: 0.75rem;
  background: rgba(244, 67, 54, 0.1);
  border-radius: var(--radius);
  display: none;
}

.error-message.show {
  display: block;
}

/* ===================================================================
   Buttons
   =================================================================== */

.btn {
  padding: 0.75rem 1.5rem;
  border: none;
  border-radius: var(--radius);
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  text-transform: none;
}

.btn-primary {
  background: var(--primary);
  color: white;
}

.btn-primary:hover {
  background: var(--primary-dark);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
}

.btn-secondary {
  background: var(--light);
  color: var(--text);
}

.btn-secondary:hover {
  background: var(--border);
}

.btn-success {
  background: var(--success);
  color: white;
}

.btn-success:hover {
  background: #45a049;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
}

.btn-block {
  width: 100%;
  margin-top: 1rem;
}

.btn-large {
  padding: 1rem 2rem;
  font-size: 1.1rem;
}

.btn-back {
  background: none;
  border: none;
  font-size: 1.2rem;
  cursor: pointer;
  padding: 0.5rem;
  color: var(--text);
  margin-bottom: 1rem;
  transition: all 0.2s ease;
}

.btn-back:hover {
  transform: translateX(-5px);
}

.btn-icon {
  background: none;
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
  padding: 0.5rem;
  transition: all 0.2s ease;
}

.btn-icon:hover {
  transform: scale(1.1);
}

/* ===================================================================
   Dashboard
   =================================================================== */

#dashboardScreen {
  background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
  overflow-y: auto;
}

.dashboard-container {
  max-width: 600px;
  margin: 0 auto;
  padding: 1.5rem;
}

.dashboard-header {
  margin-bottom: 2rem;
}

.profile-card {
  background: white;
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  display: flex;
  align-items: center;
  gap: 1.5rem;
  box-shadow: var(--shadow-lg);
}

.profile-avatar {
  font-size: 3rem;
  flex-shrink: 0;
}

.profile-info h2 {
  font-size: 1.3rem;
  color: var(--dark);
  margin-bottom: 0.25rem;
}

.profile-info p {
  color: var(--text-light);
  font-size: 0.9rem;
}

/* ===================================================================
   Stats Grid
   =================================================================== */

.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1rem;
  margin-bottom: 2rem;
}

.stat-card {
  background: white;
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  text-align: center;
  box-shadow: var(--shadow-lg);
}

.stat-value {
  font-size: 2rem;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 0.5rem;
}

.stat-label {
  color: var(--text-light);
  font-size: 0.9rem;
  font-weight: 600;
}

/* ===================================================================
   Ranking Section
   =================================================================== */

.ranking-section {
  background: white;
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  margin-bottom: 1.5rem;
  box-shadow: var(--shadow-lg);
}

.ranking-section h3 {
  margin-bottom: 1rem;
  color: var(--dark);
}

.ranking-list {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.ranking-item {
  display: flex;
  align-items: center;
  padding: 0.75rem;
  background: var(--light);
  border-radius: var(--radius);
  font-size: 0.9rem;
}

.ranking-position {
  font-weight: 700;
  color: var(--primary);
  margin-right: 1rem;
  min-width: 30px;
}

.ranking-info {
  flex: 1;
}

.ranking-name {
  font-weight: 600;
  color: var(--text);
}

.ranking-score {
  color: var(--text-light);
  font-size: 0.85rem;
}

/* ===================================================================
   Mode / Grade / Difficulty Selection
   =================================================================== */

.mode-container,
.grade-container,
.difficulty-container,
.lesson-container,
.stagemap-container {
  max-width: 600px;
  margin: 0 auto;
  padding: 1.5rem;
}

.mode-container h1,
.grade-container h1,
.difficulty-container h1,
.lesson-container h1 {
  text-align: center;
  margin: 1.5rem 0;
  color: var(--dark);
}

.modes-grid,
.grades-grid,
.difficulties-grid,
.lessons-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}

.mode-card,
.grade-card,
.difficulty-card,
.lesson-card {
  background: white;
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
  border: 3px solid transparent;
  position: relative;
}

.mode-card:hover,
.grade-card:hover,
.difficulty-card:hover,
.lesson-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-lg);
}

.mode-card.active,
.grade-card.active,
.difficulty-card.active,
.lesson-card.active {
  border-color: var(--primary);
  background: rgba(33, 150, 243, 0.05);
}

.mode-card.coming-soon,
.grade-card.coming-soon,
.difficulty-card.coming-soon,
.lesson-card.coming-soon {
  opacity: 0.5;
  cursor: not-allowed;
  pointer-events: none;
}

.mode-icon,
.difficulty-icon,
.grade-number {
  font-size: 2.5rem;
  margin-bottom: 0.75rem;
}

.mode-card h2,
.grade-card h2,
.difficulty-card h2,
.lesson-card h2 {
  font-size: 1.1rem;
  margin-bottom: 0.5rem;
  color: var(--dark);
}

.mode-card p,
.grade-card p,
.difficulty-card p,
.lesson-card p {
  font-size: 0.85rem;
  color: var(--text-light);
  margin-bottom: 0.25rem;
}

.difficulty-desc {
  color: var(--primary);
  font-weight: 600;
}

.coming-soon-label {
  color: var(--warning);
  font-weight: 700;
  font-size: 0.9rem;
}

/* ===================================================================
   Pre-Test Screen
   =================================================================== */

.pretest-container {
  max-width: 600px;
  margin: 0 auto;
  padding: 1.5rem;
}

.pretest-header {
  text-align: center;
  margin-bottom: 2rem;
}

.pretest-header h1 {
  color: var(--dark);
  margin-bottom: 0.5rem;
}

.pretest-header p {
  color: var(--text-light);
}

.pretest-instruction {
  background: rgba(33, 150, 243, 0.1);
  border-left: 4px solid var(--primary);
  padding: 1rem;
  border-radius: var(--radius);
  margin-bottom: 2rem;
}

.pretest-instruction p {
  margin: 0.5rem 0;
  color: var(--text);
  font-size: 0.95rem;
}

/* ===================================================================
   Pre-Test Question Screen
   =================================================================== */

.pretest-question-container {
  max-width: 600px;
  margin: 0 auto;
  padding: 1.5rem;
  position: relative;
}

.pretest-progress {
  margin-bottom: 1.5rem;
}

.progress-bar {
  width: 100%;
  height: 8px;
  background: rgba(0, 0, 0, 0.1);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 0.5rem;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  border-radius: 10px;
  transition: width 0.3s ease;
}

.pretest-progress p {
  text-align: center;
  color: var(--text-light);
  font-size: 0.9rem;
  font-weight: 600;
}

.question-box {
  background: white;
  border-radius: var(--radius-lg);
  padding: 2rem;
  margin-bottom: 1.5rem;
  box-shadow: var(--shadow);
}

.question-title {
  font-size: 1.1rem;
  color: var(--dark);
  margin-bottom: 1rem;
  font-weight: 600;
}

.question-options {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.option-label {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1rem;
  background: var(--light);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.2s ease;
  border: 2px solid transparent;
}

.option-label:hover {
  background: #e0e6ed;
}

.option-label input[type="radio"] {
  cursor: pointer;
  width: 20px;
  height: 20px;
}

.option-label input[type="radio"]:checked + span {
  font-weight: 700;
  color: var(--primary);
}

.timer {
  position: fixed;
  top: 1rem;
  right: 1rem;
  background: white;
  padding: 0.75rem 1.5rem;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  font-weight: 600;
  color: var(--text);
}

/* ===================================================================
   Arena Screen (Game Screen)
   =================================================================== */

.arena-container {
  max-width: 600px;
  margin: 0 auto;
  padding: 1.5rem;
  height: 100%;
  display: flex;
  flex-direction: column;
}

.arena-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5rem;
  background: white;
  padding: 1rem;
  border-radius: var(--radius-lg);
}

.arena-info {
  display: flex;
  gap: 2rem;
  font-weight: 600;
  color: var(--text);
}

.arena-content {
  flex: 1;
  background: white;
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  margin-bottom: 1.5rem;
  box-shadow: var(--shadow);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.arena-content h2 {
  color: var(--text-light);
  font-size: 0.9rem;
  margin-bottom: 1rem;
}

.formula-display {
  background: #f5f7fa;
  padding: 1.5rem;
  border-radius: var(--radius);
  margin-bottom: 1.5rem;
  border: 2px solid var(--primary);
  min-height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.formula-item {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  margin: 0 0.25rem;
}

.token-slot {
  display: inline-block;
  width: 40px;
  height: 40px;
  background: white;
  border: 2px dashed var(--primary);
  border-radius: 6px;
  text-align: center;
  line-height: 36px;
  font-weight: bold;
  color: var(--primary);
  margin: 0 2px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.token-slot:hover {
  background: rgba(33, 150, 243, 0.1);
}

.token-slot.filled {
  border-style: solid;
  background: rgba(33, 150, 243, 0.1);
  color: var(--dark);
}

.token-bank {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
  gap: 0.5rem;
  margin-bottom: 1.5rem;
}

.token {
  background: var(--primary);
  color: white;
  padding: 0.5rem;
  border-radius: var(--radius);
  text-align: center;
  font-weight: 600;
  cursor: move;
  user-select: none;
  transition: all 0.2s ease;
  border: 2px solid var(--primary);
}

.token:hover {
  transform: scale(1.05);
  box-shadow: 0 2px 8px rgba(33, 150, 243, 0.4);
}

.token.used {
  opacity: 0.3;
  pointer-events: none;
}

.formula-answer {
  background: #f5f7fa;
  padding: 1.5rem;
  border-radius: var(--radius);
  min-height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px dashed var(--border);
  flex-wrap: wrap;
  gap: 0.25rem;
}

.arena-buttons {
  display: flex;
  gap: 1rem;
  justify-content: center;
}

.arena-buttons .btn {
  flex: 1;
}

.feedback-area {
  margin-top: 1rem;
  padding: 1rem;
  background: white;
  border-radius: var(--radius);
  text-align: center;
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.feedback-correct {
  background: rgba(76, 175, 80, 0.1);
  color: var(--success);
  font-weight: 600;
  font-size: 1.1rem;
}

.feedback-wrong {
  background: rgba(244, 67, 54, 0.1);
  color: var(--danger);
  font-weight: 600;
  font-size: 1.1rem;
}

/* ===================================================================
   Stage Map
   =================================================================== */

.stage-map-content {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}

.stage-tile {
  background: white;
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  border: 2px solid var(--border);
}

.stage-tile:hover:not(.locked) {
  transform: translateY(-5px);
  box-shadow: var(--shadow-lg);
}

.stage-tile.locked {
  opacity: 0.5;
  cursor: not-allowed;
  pointer-events: none;
}

.stage-tile.completed {
  background: rgba(76, 175, 80, 0.1);
  border-color: var(--success);
}

.stage-tile.active {
  background: rgba(33, 150, 243, 0.1);
  border-color: var(--primary);
}

.stage-number {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--dark);
  margin-bottom: 0.5rem;
}

.stage-stars {
  font-size: 1.2rem;
  margin-bottom: 0.5rem;
}

.stage-label {
  font-size: 0.8rem;
  color: var(--text-light);
}

.stage-lock {
  position: absolute;
  top: 0.5rem;
  right: 0.5rem;
  font-size: 1.2rem;
}

/* ===================================================================
   Result Screen
   =================================================================== */

.result-container {
  max-width: 600px;
  margin: 0 auto;
  padding: 1.5rem;
}

.result-header {
  text-align: center;
  margin-bottom: 2rem;
}

.result-header h1 {
  color: var(--dark);
}

.result-stats {
  background: white;
  border-radius: var(--radius-lg);
  padding: 2rem;
  margin-bottom: 2rem;
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2rem;
}

.result-score,
.result-stars {
  text-align: center;
}

.score-big {
  font-size: 3rem;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 0.5rem;
}

.result-stars > div {
  font-size: 2.5rem;
  margin-bottom: 0.5rem;
}

.result-details {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1rem;
}

.result-item {
  background: var(--light);
  padding: 1rem;
  border-radius: var(--radius);
  text-align: center;
}

.result-item span:first-child {
  display: block;
  color: var(--text-light);
  font-size: 0.9rem;
  margin-bottom: 0.5rem;
}

.result-item span:last-child {
  display: block;
  font-weight: 700;
  color: var(--primary);
  font-size: 1.1rem;
}

.result-recommendation {
  background: rgba(255, 193, 7, 0.1);
  border-left: 4px solid var(--warning);
  padding: 1rem;
  border-radius: var(--radius);
  margin-bottom: 2rem;
}

.result-recommendation p {
  color: var(--text);
}

.wrong-formulas-section,
.review-section {
  background: white;
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  margin-bottom: 2rem;
  box-shadow: var(--shadow);
}

.wrong-formulas-section h3,
.review-section h3 {
  margin-bottom: 1rem;
  color: var(--dark);
}

.formulas-list,
.wrong-formulas-list {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.formula-item-card {
  background: var(--light);
  padding: 1rem;
  border-radius: var(--radius);
  border-left: 4px solid var(--danger);
}

.formula-item-card strong {
  color: var(--text);
  display: block;
  margin-bottom: 0.25rem;
}

.formula-item-card small {
  color: var(--text-light);
}

/* ===================================================================
   Boss Stage
   =================================================================== */

.boss-container {
  max-width: 600px;
  margin: 0 auto;
  padding: 1.5rem;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  height: 100%;
}

.boss-warning {
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  color: white;
  border-radius: var(--radius-lg);
  padding: 3rem 2rem;
  margin-bottom: 2rem;
  box-shadow: var(--shadow-lg);
}

.boss-icon {
  font-size: 4rem;
  margin-bottom: 1rem;
  animation: shake 0.5s ease-in-out infinite;
}
